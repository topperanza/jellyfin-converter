name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Show Bash version
        run: bash --version

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install ShellCheck
        env:
          PIP_INDEX_URL: ${{ secrets.PIP_INDEX_URL }}
          PIP_EXTRA_INDEX_URL: ${{ secrets.PIP_EXTRA_INDEX_URL }}
        run: |
          ./scripts/install_shellcheck.sh

      - name: Verify ShellCheck
        run: shellcheck --version

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ffmpeg

      - name: Verify ffmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Bash Syntax Check
        run: |
          find . -type f -name "*.sh" -print0 | xargs -0 bash -n

      - name: Run ShellCheck
        run: |
          find . -type f -name "*.sh" \
            -not -path "./.git/*" \
            -not -path "./.venv/*" \
            -print0 | xargs -0 shellcheck -x -S error

      - name: Check Bash 3.2 compatibility
        run: |
          ./scripts/check_bash32.sh

      - name: Validate release docs/version sync
        run: |
          ./scripts/validate_release_docs.sh

      - name: Validate action pinning
        run: |
          ./scripts/check_action_pinning.sh

      - name: Codex workflow conformance (hard gate)
        run: |
          bash scripts/codex/check-workflow-conformance.sh

      - name: Run Tests
        run: |
          if [ -x "./tests/run.sh" ]; then
            if command -v ffprobe >/dev/null 2>&1; then
              ./tests/run.sh "tests/suite_*.sh tests/test_*.sh"
            else
              files=$(ls tests/suite_*.sh tests/test_*.sh 2>/dev/null || true)
              filtered=""
              skip_files="tests/test_subtitles_fix.sh"
              for f in tests/suite_*.sh tests/test_*.sh; do
                [ -f "$f" ] || continue
                if ! grep -qi ffprobe "$f"; then
                  skip=0
                  for s in $skip_files; do
                    if [ "$f" = "$s" ]; then skip=1; break; fi
                  done
                  if [ "$skip" -eq 0 ]; then
                    filtered="$filtered $f"
                  fi
                fi
              done
              if [ -n "$filtered" ]; then
                $TEST_SHELL ./tests/run.sh "$filtered"
              else
                echo "No ffprobe-independent tests found; skipping."
              fi
            fi
          elif [ -f "./tests/run.sh" ]; then
            $TEST_SHELL ./tests/run.sh "tests/suite_*.sh tests/test_*.sh"
          else
            echo "No test runner found."
          fi
