name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to promote (e.g. v1.0.0)'
        required: true
        type: string
      promote_only:
        description: 'Only promote an existing draft release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-draft:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.promote_only)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: meta
        name: Resolve tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify VERSION matches tag
        run: |
          expected="v$(cat VERSION)"
          actual="${{ steps.meta.outputs.tag }}"
          if [[ "$expected" != "$actual" ]]; then
            echo "ERROR: VERSION mismatch: expected $expected got $actual"
            exit 1
          fi

      - name: Validate release gates
        run: |
          ./scripts/validate_release_docs.sh
          ./scripts/check_action_pinning.sh

      - name: Build release package
        run: |
          ./scripts/package_release.sh ./dist

      - name: Validate installer against package
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ./scripts/validate_installer.sh ./dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "ERROR: release $tag already exists"
            exit 1
          fi
          gh release create "$tag" \
            --title "Jellyfin Converter $tag" \
            --notes-file "docs/releases/$tag.md" \
            --draft \
            dist/release.tar.gz \
            dist/checksums.txt \
            dist/install.sh \
            dist/VERSION \
            dist/CHANGELOG.md

  promote:
    needs: [build-and-draft]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.promote_only)
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Promote draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.build-and-draft.outputs.tag }}"
          gh release edit "$tag" --draft=false

  promote-existing:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_only
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Promote existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag }}"
          gh release edit "$tag" --draft=false
